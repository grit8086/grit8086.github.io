{{ define "main" }}

{{ $posts := (.Site.GetPage "section" "posts").Pages }}

<h1>recent</h1>
<ul class="blogs">
  {{ range first 5 (sort $posts "Date" "desc") }}
    <li class="blog-item">
      <a href="{{ .RelPermalink }}" class="blog-link">
        {{ .Title }}
      </a>
      <small>
        <span class="blog-date">
          [ {{ .Date.Format "2006-01-02" }} ]
        </span>
      </small>
    </li>
  {{ end }}
</ul>

{{ end }}
